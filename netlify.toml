[build]
  publish = "."
  command = "echo 정적 사이트 - 빌드 단계 없음"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  port = 8888
  publish = "."
  autoLaunch = false

# 개발용 폴더와 원본 스크립트는 공개하지 않는다
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # 마이크는 이 사이트(음성으로 질문하기)에서만 허용
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
